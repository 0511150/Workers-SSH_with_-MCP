name = "workers-ssh-with-mcp"
main = "src/worker.ts"
compatibility_date = "2026-07-01"
workers_dev = false
routes = [{ pattern = "ssh.05s.us", custom_domain = true }]

[build]
command = "node node_modules/vite/bin/vite.js build --config vite.config.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[observability]
enabled = true

[observability.traces]
enabled = true

[secrets]
required = ["ACCESS_KEY"]

[[durable_objects.bindings]]
name = "SSH_SESSIONS"
class_name = "SSHSessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SSHSessionDO"]

[[durable_objects.bindings]]
name = "AUTH_GUARD"
class_name = "AuthGuard"

[[durable_objects.bindings]]
name = "MCP_SSH"
class_name = "MCPSSHSession"

[[migrations]]
tag = "v2-mcp-auth"
new_sqlite_classes = ["AuthGuard", "MCPSSHSession"]
